name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # 1.18.26 (this project's original pin) bundles a platform-tools Rust
  # toolchain from Feb 2024 (1.75.0) — too old to compile current crates.io
  # dependency versions (hit "feature `edition2024` is required" trying to
  # build a 2026-era `toml_edit`). 4.1.2 matches the Solana CLI version
  # already verified working for every build in this repo's own
  # development (`solana --version` on the dev machine).
  SOLANA_VERSION: 4.1.2
  # Must match the anchor-lang version pinned in programs/*/Cargo.toml —
  # anchor-cli refuses to run against a mismatched anchor-lang version, and
  # will tell you to `avm install` whatever version parses out of Cargo.toml
  # rather than the one you actually have active. Check
  # programs/*/Cargo.toml's `anchor-lang = { version = "=X.Y.Z" }` line
  # before bumping this.
  ANCHOR_VERSION: 1.0.2
  # 18 hit "Unknown file extension .ts" from ts-mocha (Node's native ESM
  # loader grabbing tests/*.ts instead of ts-node's CommonJS require hook)
  # — 22 matches the dev machine this whole test suite was actually
  # written and run against all session.
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt check
        run: cargo fmt --check --all --manifest-path Cargo.toml
        continue-on-error: true

      - name: Install frontend deps
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci
          fi

      - name: ESLint
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm run lint --if-present
          fi

  test-contracts:
    name: Anchor Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Install ts-mocha deps
        run: npm ci

      # Not `anchor build` / `anchor test`: this project's programs use
      # MagicBlock's Ephemeral Rollup features that a bare
      # solana-test-validator can't run anyway (see docs/WINDOWS_NOTES.md —
      # the same reasoning applies on Linux CI, not just Windows dev
      # machines), so there's no local-validator target worth spinning up
      # here. `target/` is gitignored, so target/idl/*.json (which
      # tests/*.ts require()) must be regenerated from source every run.
      #
      # Cargo.lock is committed pinned at `version = 3` on purpose: the
      # Solana CLI's bundled cargo-build-sbf toolchain (pinned to
      # SOLANA_VERSION above, independent of whatever host Rust runs this
      # step) can't parse a `version = 4` lockfile without
      # `-Znext-lockfile-bump` — a nightly-only flag. If `cargo update`
      # ever bumps this back to 4 (a newer host cargo will happily rewrite
      # it), either edit the header back to 3 by hand (safe as long as
      # there are no git-sourced dependencies — check with
      # `grep '^source = "git' Cargo.lock`) or bump SOLANA_VERSION to one
      # whose bundled toolchain understands v4.
      - name: Build programs
        run: |
          for dir in programs/*/; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "Building $dir"
              (cd "$dir" && cargo build-sbf)
            fi
          done

      - name: Generate IDLs
        run: |
          mkdir -p target/idl target/types
          anchor idl build -p sealed_auction -o target/idl/sealed_auction.json -t target/types/sealed_auction.ts
          anchor idl build -p private_voting -o target/idl/private_voting.json -t target/types/private_voting.ts
          anchor idl build -p spl_token_manager -o target/idl/spl_token_manager.json -t target/types/spl_token_manager.ts

      # Structural/offline tests only — the live Devnet suites
      # (tests/*.ts's "live devnet e2e" describe blocks) self-skip unless
      # RUN_*_DEVNET_E2E=1, which CI intentionally never sets: they need a
      # funded devnet wallet and RELAY_SPONSOR_SECRET_KEY that don't belong
      # in CI secrets for a hackathon-scoped project. Run those locally via
      # `make test-devnet-e2e` instead — see docs/KNOWN_ISSUES.md.
      - name: Run structural tests
        run: npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & build
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm run build
          else
            echo "Frontend not scaffolded yet — skipping build"
          fi
