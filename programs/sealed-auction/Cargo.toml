[package]
name = "sealed-auction"
version = "0.1.0"
description = "AVS sealed-bid deal auction: startups post deals, angels place private bids, equity is distributed proportionally at reveal"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sealed_auction"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control"] }
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }
