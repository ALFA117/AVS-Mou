[package]
name = "spl-token-manager"
version = "0.1.0"
description = "AVS equity SPL token creation, gasless ER transfers between syndicate members, and L1 settlement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spl_token_manager"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
