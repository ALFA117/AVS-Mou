[package]
name = "private-voting"
version = "0.1.0"
description = "AVS private milestone voting: syndicate members cast sealed YES/NO votes, revealed simultaneously, rewards distributed via VRF"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "private_voting"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control", "vrf"] }
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }
